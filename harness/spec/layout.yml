# Layout & limit spec — SINGLE SOURCE OF TRUTH for the harness.
#
# This file is read by:
#   • harness/checks/*.py  — judgement thresholds
#   • harness/fixers/*.py  — how-much-to-cut targets
#   • reference/layout-spec.md  — human-readable mirror (Claude reads when writing scenes)
#
# When you change a number here, the change propagates everywhere. Don't
# duplicate these values elsewhere — drift causes bugs in the seam between
# "skill says X" and "harness checks Y".

# ───── DSL syntax surface (mirror of backend/lecturetex/spec.py) ─────
# regenerated by scripts/regen_dsl_spec.py. Manual edits here will be
# overwritten next regen. The harness uses these to know which macro
# is valid and which opt is whitelisted.
dsl_snapshot_path: spec/dsl.json

# ───── Canvas (aspect → pixel dims, from compiler.py:aspect_to_canvas) ─────
canvas:
  "16:9":  { w: 1280, h: 720  }
  "9:16":  { w: 720,  h: 1280 }
  "1:1":   { w: 720,  h: 720  }
  "4:3":   { w: 960,  h: 720  }
  "3:4":   { w: 720,  h: 960  }
  "4:5":   { w: 720,  h: 900  }
  "21:9":  { w: 1680, h: 720  }

# ───── Safe zones (fraction of canvas height) ─────
# Reserved bands where text/cards should NOT land. Used by overflow and
# caption-density checks. Captions burn in the bottom band, watermark in
# the bottom-right corner of the bottom band.
safe_zones:
  top_reserved_frac:    0.08    # top 8% — leave for headlines / kicker
  bottom_reserved_frac: 0.13    # bottom 13% — captions + watermark
  # The middle band [0.08, 0.87] is where main content lives.

# ───── \say text length (DashScope CosyVoice v3-flash limit) ─────
# CosyVoice WebSocket synth rejects requests > ~600 chars (varies by
# language). Stay safely under to avoid mid-sentence failures.
say:
  max_chars: 600         # hard fail above this
  warn_chars: 400        # warn — risk of mid-call slowdown / split mid-sentence

# ───── \caption density (chars / view-duration ratio) ─────
# Above this rate, Whisper word-alignment can't keep up — the caption
# dumps on screen instead of rolling. Empirically ~4 chars/sec for
# Chinese, ~10 chars/sec for English. We use the lower bound.
caption:
  max_chars_per_sec: 4
  warn_chars_per_sec: 3
  # If the view has no \audio / \say, captions can't time-align at all
  # (no audio to align to). Such a caption renders static for view duration.
  require_audio_for_align: true

# ───── \manimFile retime rule (HARD BAN #1) ─────
# \manimFile DEFAULTS to retime=false since the 2026-05-22
# non-destructive-syntax audit. The skill requires [retime=true] on every
# \manimFile so audio-first scaling engages.
manimfile:
  require_retime_true: true

# ───── Forbidden patterns ─────
forbidden_macros:
  # LLM-prompt-driven macros (HARD BAN #1) — backend allows them but the
  # skill mandates hand-written {path} files because LLM codegen is
  # unstable.
  - {macro: 'manim',    arg_form: 'prompt', reason: 'LLM-prompt forbidden — use \\manimFile{path.py}'}
  - {macro: 'html',     arg_form: 'prompt', reason: 'LLM-prompt forbidden — use \\htmlFile{path.html}'}
  - {macro: 'remotion', arg_form: 'prompt', reason: 'LLM-prompt forbidden — use \\remotionFile{path.tsx}'}
  - {macro: 'show',     arg_form: 'any',    reason: 'router-routed prompt forbidden — pick an engine and use the file variant'}

retired_macros:
  # Backend parser warn-only — but the skill considers writing these a hard
  # error (write the modern form instead).
  - {macro: 'text', replacement: '\\caption{...}', since: '2026-05-21'}

deprecated_opts:
  # Per-macro opts that still parse but emit warnings — fail in the harness.
  - {macro: 'say', opt: 'mute',
     replacement: '\\caption{...}',
     reason: 'caption-only \\say is the wrong primitive; \\caption is non-destructive'}

# ───── Pre-cut detection (HARD BAN #11) ─────
# Filenames in the work dir matching these patterns indicate the user
# pre-cut footage with external tools. Cuts MUST be expressed in .tex via
# \video[start=,end=] / \audio[start=,end=].
precut_filename_patterns:
  - '_cut\.mp4$'
  - '_concat\.mp4$'
  - 'trimmed_.*\.mp4$'
  - '.*_clipped\.(mp4|m4a|wav)$'

# ───── L3 layout-manager: HTML render checks (Playwright) ─────
# Open every \htmlFile{} scene at the project canvas size in headless
# Chromium, walk all visible elements via getBoundingClientRect(), check
# overflow + text-overlap. Requires Playwright in comfyui env (the
# backend already needs it for \htmlFile rendering — no new dep).
html_render:
  overflow_px_tolerance: 2     # anti-aliasing slack at canvas edges
  # text-overlap: when two text-bearing elements at the SAME z_index
  # overlap by more than this fraction of the smaller bbox, flag.
  # Layered designs (text on a card → different z_index) are not flagged.
  text_overlap_pct: 30

# ───── Voice-clone consistency ─────
# When the authenticated user has a registered voice sample
# (User.voice_sample_path != NULL), all \say{} macros in the project
# SHOULD carry voice=mine. Otherwise we silently fall back to the
# default speaker, losing the user's intent.
voice_clone:
  enforce_when_sample_registered: true
  # When auth is not available (no env var, no cache), this check is
  # silently skipped — no false fails for offline runs.
