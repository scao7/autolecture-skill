  html, body { margin: 0; padding: 0; background: #0d1117; width: 100%; height: 100%; }
  .ok { position: absolute; top: 100px; left: 100px; width: 200px; height: 50px;
        background: #6ec1e4; color: #fff; }
  .over { position: absolute; top: 1200px; left: 50px; width: 600px; height: 200px;
          background: #ee6c4d; color: #fff; font-size: 24px; padding: 16px; }
  .also_over { position: absolute; top: 200px; left: 800px; width: 300px; height: 40px;
               background: #f4d35e; color: #000; }
</style></head><body>
  <div class="ok">这个在画布内</div>
  <div class="over">这一段会超出底部</div>
  <div class="also_over">这一段超出右边</div>
</body></html>
